version: '3.8'

# ── Task 8 (optional): Visualize k6 results in Grafana ────────────────────────
#
# Start:   docker compose up -d
# Then:    k6 run --out influxdb=http://localhost:8086/k6 tests/05_auth_flow.js
# Open:    http://localhost:3001  (admin / admin)
#
# Import the official k6 dashboard: Grafana → Dashboards → Import → ID 2587

services:

  influxdb:
    image: influxdb:1.8-alpine
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"   # host:3001 so it doesn't clash with our Express app on 3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  grafana_data:
