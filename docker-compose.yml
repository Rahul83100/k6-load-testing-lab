version: '3.8'

services:
  k6-christ-load-test:
    build: .
    container_name: christ_k6_control_center
    restart: unless-stopped
    ports:
      - "3001:3001"   # Web Performance Control Center & Real-Time Logs
      - "5665:5665"   # Native Live Grafana Dashboard
    volumes:
      - ./har_files:/app/har_files
      - ./tests/data:/app/tests/data
      - ./tests/christ_university/reports:/app/tests/christ_university/reports
    environment:
      - NODE_ENV=production
