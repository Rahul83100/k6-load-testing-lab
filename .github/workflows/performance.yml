# ──────────────────────────────────────────────────────────────────
#  Performance Gate — CI workflow
#  Runs the k6 CI test (08_ci_pipeline.js) against the local
#  Express server on every push to main and every pull request.
#  Strict thresholds act as a merge gate: if performance regresses
#  beyond the SLO budget, the pipeline fails and the PR is blocked.
# ──────────────────────────────────────────────────────────────────

name: Performance Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent parallel performance runs — they'd compete for resources
# and produce unreliable numbers.  Queue the latest, cancel stale.
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-gate:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js (for Express server) ────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # ── 3. Install k6 ─────────────────────────────────────────
      - name: Install k6
        run: |
          sudo gpg -k \
          && sudo gpg --no-default-keyring \
              --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 \
              --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68 \
          && echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' \
              | sudo tee /etc/apt/sources.list.d/k6.list \
          && sudo apt-get update \
          && sudo apt-get install -y k6

      # ── 4. Install server dependencies ─────────────────────────
      - name: Install server dependencies
        run: cd server && npm ci

      # ── 5. Start the Express server in background ──────────────
      - name: Start Express server
        run: cd server && node index.js &

      # ── 6. Wait for server readiness ───────────────────────────
      - name: Wait for server to be ready
        run: sleep 3

      # ── 7. Run the CI performance test ─────────────────────────
      - name: Run k6 CI performance test
        run: k6 run tests/08_ci_pipeline.js

      # ── 8. Summary ─────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  Performance Gate Complete                       ║"
          echo "║                                                  ║"
          echo "║  Test: tests/08_ci_pipeline.js                   ║"
          echo "║  Thresholds enforced — see step above for        ║"
          echo "║  pass/fail details.                              ║"
          echo "║                                                  ║"
          echo "║  Artifact: summary.json (k6 structured output)  ║"
          echo "╚══════════════════════════════════════════════════╝"

      # ── 9. Upload k6 results as build artifact ─────────────────
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: summary.json
          retention-days: 30
